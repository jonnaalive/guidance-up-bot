name: Hourly guidance screening

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: '실제 Discord 발송 없이 운영 점검'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hourly-guidance-screening
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore screening state
        id: state
        uses: actions/cache/restore@v4
        with:
          path: data
          key: guidance-state-${{ github.run_id }}
          restore-keys: |
            guidance-state-

      - name: Restore persistent state
        id: durable
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/runtime_state.py restore screening-state data

      - name: Require existing delivery history
        run: |
          if [ '${{ steps.durable.outputs.restored }}' != 'true' ] && [ -z '${{ steps.state.outputs.cache-matched-key }}' ]; then
            echo 'No delivery history: refusing to replay the seed database.'
            exit 1
          fi
          test -f data/guidance.db
      - name: Run regression tests
        run: pip install pytest && python -m pytest -q

      - name: Screen SEC earnings filings
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FORMS: 8-K,6-K,10-Q,10-K
          FEED_COUNT: "100"
          FEED_PAGES: "5"
          LOOKBACK_HOURS: "72"
          EARNINGS_ONLY: "true"
          MIN_CONFIDENCE: "0.80"
          DATA_DIR: ./data
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = 'true' ]; then
            python main.py --once --dry-run
          else
            python main.py --once
          fi

      - name: Save persistent state
        if: always() && steps.durable.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/runtime_state.py save screening-state data

      - name: Save screening state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: guidance-state-${{ github.run_id }}

      - name: Publish latest signals
        if: always() && steps.durable.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/latest_signals.json
          git diff --cached --quiet || git commit -m "chore: publish guidance signals"
          git push

name: Hourly guidance screening

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hourly-guidance-screening
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Seed first screening state
        run: |
          mkdir -p data
          cp seed/guidance.db data/guidance.db

      - name: Restore screening state
        id: state
        uses: actions/cache/restore@v4
        with:
          path: data
          key: guidance-state-${{ github.run_id }}
          restore-keys: |
            guidance-state-

      - name: Screen SEC earnings filings
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FORMS: 8-K,6-K,10-Q,10-K
          FEED_COUNT: "100"
          FEED_PAGES: "5"
          LOOKBACK_HOURS: "72"
          EARNINGS_ONLY: "true"
          MIN_CONFIDENCE: "0.80"
          DATA_DIR: ./data
        run: python main.py --once

      - name: Save screening state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: guidance-state-${{ github.run_id }}




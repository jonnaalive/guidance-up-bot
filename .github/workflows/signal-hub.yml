name: Investment signal hub digest
on:
  schedule:
    - cron: "7,37 * * * *"
    - cron: "30 13 * * *"
    - cron: "0 12 * * 0"
  workflow_dispatch:
    inputs:
      polls_only:
        description: '투표 결과만 확인 (보고서 발송 없음)'
        type: boolean
        default: false
      test_poll:
        description: '연결 테스트 투표 1개 생성·조회 (실제 종목 상태 변경 없음)'
        type: boolean
        default: false
      weekly:
        type: boolean
        default: false
      review_ticker:
        description: '분석 완료·보류할 티커 (비우면 정기 보고)'
        type: string
        default: ''
      review_status:
        type: choice
        options: [done, snoozed, reopen]
        default: done
      review_until:
        description: '완료 기준 시각 또는 보류 종료일 (비우면 완료=현재, 보류=30일)'
        type: string
        default: ''
permissions:
  contents: write
concurrency:
  group: signal-hub-delivery
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jonnaalive/investment-signal-hub
          path: hub
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hub/requirements.txt
      - run: pip install -r hub/requirements.txt
      - name: Restore delivery history
        id: durable
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/runtime_state.py restore digest-state hub/runtime
      - name: Send correlated report
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          HELD_TICKERS: GEV,POWL,BE,STRL,SDRL,KGS,OCUL,BKR,LPG,TDW,HRMY,TARS,DINO,FTI
          WATCH_TICKERS: 7181,AGCO,CAT,EROC,HSHP,MPC,MPLX,NOV,OKE,SITM,VG,VLO
          REVIEW_TICKER: ${{ inputs.review_ticker }}
          REVIEW_STATUS: ${{ inputs.review_status }}
          REVIEW_UNTIL: ${{ inputs.review_until }}
          POLLS_ONLY: ${{ inputs.polls_only }}
          TEST_POLL: ${{ inputs.test_poll }}
        run: |
          if [ -n "$REVIEW_TICKER" ]; then
            python hub/hub.py --review-ticker "$REVIEW_TICKER" --review-status "$REVIEW_STATUS" --review-until "$REVIEW_UNTIL"
          elif [ "$TEST_POLL" = 'true' ]; then
            python hub/hub.py --test-poll
          elif [ "$POLLS_ONLY" = 'true' ] || [ '${{ github.event.schedule }}' = '7,37 * * * *' ]; then
            python hub/hub.py --polls-only
          elif [ "${{ github.event.schedule }}" = "0 12 * * 0" ] || [ "${{ inputs.weekly }}" = "true" ]; then
            python hub/hub.py --weekly
          else
            python hub/hub.py
          fi
      - name: Save delivery history
        if: always() && steps.durable.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/runtime_state.py save digest-state hub/runtime
